<app-ui-page [title]="facade.translation()['TITLE']">
  <button
    slot="actions"
    class="progress__add-btn"
    [type]="ButtonType.Button"
    (click)="addSubject()"
    [attr.aria-label]="facade.translation()['ADD_SUBJECT']">
    <mat-icon aria-hidden="true">add</mat-icon>
  </button>

  @if (facade.isLoading()) {
    <app-ui-skeleton
      class="progress__skeleton"
      [variant]="skeletonVariant.Card"
      [count]="3" />
  } @else if (facade.hasError()) {
    <p class="progress__status progress__status--error">{{ facade.translation()['ERROR'] }}</p>
  } @else if (facade.isEmpty()) {
    <app-empty-state
      [icon]="MaterialIcon.FitnessCenter"
      [text]="facade.translation()['EMPTY']" />
  } @else {
    <ul class="progress__list">
      @for (subject of facade.subjects(); track subject.id) {
        <li class="progress__list-item">
          <app-subject-card [subject]="subject" (selected)="navigateToSubject(subject.id)" />
        </li>
      }
    </ul>
  }

  @if (facade.errorMessage()) {
    <p class="progress__form-error">{{ facade.errorMessage() }}</p>
  }
</app-ui-page>

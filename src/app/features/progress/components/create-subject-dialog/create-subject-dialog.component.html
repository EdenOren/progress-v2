@let t = translation();
<app-ui-modal>
  <span slot="title">{{ t['TITLE'] }}</span>
  <div slot="content">
    <form [formRoot]="createSubjectForm">
      <app-ui-input
        [inputId]="'subject-name'"
        [label]="t['NAME_LABEL']"
        [placeholder]="t['NAME_PLACEHOLDER']"
        [field]="createSubjectForm.name"
        [error]="nameError()"
        [touched]="nameTouched()" />
      <app-ui-input
        [inputId]="'subject-description'"
        [label]="t['DESCRIPTION_LABEL']"
        [placeholder]="t['DESCRIPTION_PLACEHOLDER']"
        [field]="createSubjectForm.description" />
    </form>
  </div>
  <div slot="actions">
    <app-ui-button
      [label]="t['CANCEL']"
      [variant]="buttonVariant.Ghost"
      (click)="cancel()" />
    <app-ui-button
      [label]="t['SAVE']"
      [variant]="buttonVariant.Ghost"
      [color]="'primary'"
      (click)="submit()" />
  </div>
</app-ui-modal>

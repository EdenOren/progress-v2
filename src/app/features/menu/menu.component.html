<app-ui-page [title]="titleLabel()" [narrow]="true">
  <header class="menu__identity">
    <app-user-avatar [initial]="userInitial()" [size]="userAvatarSize.Sm" />
    <p class="menu__identity-name">{{ userName() }}</p>
  </header>

  <nav class="menu__content" [attr.aria-label]="titleLabel()">
    <button class="menu__row" [type]="buttonType.Button" (click)="onNavigateToProfile()">
      <span class="menu__row-label">{{ profileLabel() }}</span>
      <app-ui-icon class="menu__row-chevron" [src]="appIcon.ChevronRight" aria-hidden="true" />
    </button>
    <button class="menu__row" [type]="buttonType.Button" (click)="onNavigateToSettings()">
      <span class="menu__row-label">{{ settingsLabel() }}</span>
      <app-ui-icon class="menu__row-chevron" [src]="appIcon.ChevronRight" aria-hidden="true" />
    </button>
    <button
      class="menu__row menu__row--destructive"
      [type]="buttonType.Button"
      [disabled]="isLoggingOut()"
      (click)="onLogout()">
      <span class="menu__row-label">{{ logoutLabel() }}</span>
    </button>
  </nav>
</app-ui-page>

<div class="log-card">
  <div class="log-card__header">
    <span class="log-card__date">{{ entry().loggedDate | date: 'EEE, MMM d' }}</span>
    <app-ui-button
      [label]="translation()['EDIT']"
      [variant]="buttonVariant.Ghost"
      [iconOnly]="true"
      [iconSrc]="appIcon.Edit"
      (click)="onEdit()" />
  </div>

  <div
    class="log-card__metrics"
    [style.--log-card-metric-columns]="metricColumns()"
    [style.--log-card-metric-columns-compact]="compactMetricColumns()">
    @for (metric of metrics(); track metric.key) {
      <app-ui-stat-tile [label]="metric.label" [value]="metric.value" [unit]="metric.unit" />
    }
  </div>
</div>

<app-ui-page [title]="facade.translation()['TITLE']">
  <button
    slot="primary"
    class="daily-log__add-btn"
    [type]="ButtonType.Button"
    (click)="onLogToday()">
    {{ facade.translation()['LOG_TODAY'] }}
  </button>

  @if (facade.saveError()) {
    <p class="daily-log__status daily-log__status--error">{{ facade.translation()['SAVE_ERROR'] }}</p>
  }
  @if (facade.isLoading()) {
    <app-ui-skeleton [variant]="skeletonVariant.Card" [count]="3" />
  } @else if (facade.hasError()) {
    <p class="daily-log__status daily-log__status--error">{{ facade.translation()['ERROR'] }}</p>
  } @else if (facade.isEmpty()) {
    <app-empty-state
      [icon]="MaterialIcon.EventNote"
      [text]="facade.translation()['EMPTY']" />
  } @else {
    <ul class="daily-log__list">
      @for (entry of facade.entries(); track entry.id) {
        <li class="daily-log__list-item">
          <app-log-card
            [entry]="entry"
            [translation]="facade.translation()"
            [weightUnit]="facade.weightUnit()"
            (editClicked)="onEditEntry($event)" />
        </li>
      }
    </ul>
  }
</app-ui-page>

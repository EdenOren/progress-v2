@let t = facade.translation();

<div class="forgot-password-page">
  <div class="forgot-password-page__card">
    <header class="forgot-password-page__header">
      <h1 class="forgot-password-page__title">{{ t['TITLE'] }}</h1>
      <p class="forgot-password-page__subtitle">{{ t['SUBTITLE'] }}</p>
    </header>

    @if (facade.submitSuccess()) {
      <p class="forgot-password-page__success">{{ t['SUCCESS'] }}</p>
    } @else {
      <form class="forgot-password-page__form" [formRoot]="forgotPasswordForm">
        <app-ui-input
          inputId="forgot-password-email"
          [label]="t['EMAIL_LABEL']"
          [placeholder]="t['EMAIL_PLACEHOLDER']"
          [type]="inputType.Email"
          autocomplete="email"
          [field]="forgotPasswordForm.email"
          [error]="emailError()"
          [touched]="emailTouched()"
        />

        @if (facade.errorMessage()) {
          <p class="forgot-password-page__error">{{ facade.errorMessage() }}</p>
        }

        <app-ui-button
          [label]="facade.submitLabel()"
          [type]="buttonType.Button"
          [isLoading]="facade.isLoading()"
          (click)="submit()"
        />
      </form>
    }

    <p class="forgot-password-page__footer">
      <app-ui-link [label]="t['BACK_TO_LOGIN']" [route]="['../', authRoute.Login]" />
    </p>
  </div>
</div>

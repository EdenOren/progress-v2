@let t = facade.translation();

<div class="reset-password-page">
  @if (!facade.ready()) {
    <div class="reset-password-page__spinner" aria-hidden="true"></div>
  } @else if (!facade.canReset()) {
    <div class="reset-password-page__card">
      <p class="reset-password-page__invalid">{{ t['INVALID_LINK'] }}</p>
      <app-ui-link [label]="t['REQUEST_NEW_LINK']" [route]="['../', authRoute.ForgotPassword]" />
    </div>
  } @else {
    <div class="reset-password-page__card">
      <header class="reset-password-page__header">
        <h1 class="reset-password-page__title">{{ t['TITLE'] }}</h1>
        <p class="reset-password-page__subtitle">{{ t['SUBTITLE'] }}</p>
      </header>

      <form class="reset-password-page__form" [formRoot]="resetPasswordForm">
        <app-ui-input
          inputId="reset-password-password"
          [label]="t['PASSWORD_LABEL']"
          [placeholder]="t['PASSWORD_PLACEHOLDER']"
          [type]="inputType.Password"
          autocomplete="new-password"
          [field]="resetPasswordForm.password"
          [error]="passwordError()"
          [touched]="passwordTouched()"
        />

        <app-ui-input
          inputId="reset-password-confirm-password"
          [label]="t['CONFIRM_PASSWORD_LABEL']"
          [placeholder]="t['CONFIRM_PASSWORD_PLACEHOLDER']"
          [type]="inputType.Password"
          autocomplete="new-password"
          [field]="resetPasswordForm.confirmPassword"
          [error]="confirmPasswordError()"
          [touched]="confirmPasswordTouched()"
        />

        @if (facade.errorMessage()) {
          <p class="reset-password-page__error">{{ facade.errorMessage() }}</p>
        }

        <app-ui-button
          [label]="facade.submitLabel()"
          [type]="buttonType.Button"
          [isLoading]="facade.isLoading()"
          (click)="submit()"
        />
      </form>
    </div>
  }
</div>

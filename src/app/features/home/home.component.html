<div class="home">
  <nav class="home__sidebar" aria-label="Main navigation">
    @for (tab of facade.tabs(); track tab.route) {
      <button
        class="home__sidebar-tab"
        [class.home__sidebar-tab--active]="tab.isActive"
        [type]="buttonType.Button"
        (click)="navigate(tab.route)"
        [attr.aria-current]="tab.isActive ? 'page' : null">
        <app-ui-icon class="home__sidebar-tab-icon" [src]="tab.icon" aria-hidden="true" />
        <span class="home__sidebar-tab-label">{{ tab.label }}</span>
      </button>
    }
  </nav>
  <main class="home__content">
    @if (facade.isNewDevice()) {
      <div class="home__device-alert" role="alert">
        <span class="home__device-alert-message">{{ facade.newDeviceAlertMessage() }}</span>
        <app-ui-button
          class="home__device-alert-dismiss"
          [label]="facade.newDeviceAlertDismissLabel()"
          [type]="buttonType.Button"
          [variant]="buttonVariant.Ghost"
          [size]="buttonSize.Sm"
          (click)="dismissDeviceAlert()" />
      </div>
    }
    <router-outlet />
  </main>
  <nav class="home__nav" aria-label="Main navigation">
    @for (tab of facade.tabs(); track tab.route) {
      <button
        class="home__tab"
        [class.home__tab--active]="tab.isActive"
        [type]="buttonType.Button"
        (click)="navigate(tab.route)"
        [attr.aria-current]="tab.isActive ? 'page' : null">
        <app-ui-icon class="home__tab-icon" [src]="tab.icon" aria-hidden="true" />
        <span class="home__tab-label">{{ tab.label }}</span>
      </button>
    }
  </nav>
</div>

@let t = facade.translation();

<app-ui-page [title]="facade.subject()?.name ?? ''">
  <button
    slot="leading"
    class="subject__icon-btn"
    [type]="ButtonType.Button"
    (click)="navigateBack()"
    [attr.aria-label]="t['BACK']">
    <app-ui-icon [src]="appIcon.ArrowBack" aria-hidden="true" />
  </button>

  <button
    slot="actions"
    class="subject__icon-btn"
    [type]="ButtonType.Button"
    [matMenuTriggerFor]="subjectMenu"
    [attr.aria-label]="t['MORE_ACTIONS']">
    <app-ui-icon [src]="appIcon.MoreVert" aria-hidden="true" />
  </button>

  <button
    slot="primary"
    class="subject__start-btn"
    [type]="ButtonType.Button"
    [disabled]="facade.isStartingWorkout()"
    (click)="startWorkout()">
    {{ facade.startWorkoutLabel() }}
  </button>

  <mat-menu #subjectMenu="matMenu">
    <button mat-menu-item [type]="ButtonType.Button" (click)="deleteSubject()">
      {{ t['DELETE_TITLE'] }}
    </button>
  </mat-menu>

  @if (facade.isLoading()) {
    <app-ui-skeleton [variant]="skeletonVariant.Row" [count]="4" />
  } @else if (facade.hasError()) {
    <p class="subject__status subject__status--error">{{ t['ERROR'] }}</p>
  } @else if (facade.isEmpty()) {
    <app-empty-state [icon]="appIcon.History" [text]="t['EMPTY']" />
  } @else {
    <ul class="subject__list">
      @for (entry of facade.entries(); track entry.id) {
        <li class="subject__list-item">
          <app-entry-card [entry]="entry" (selected)="navigateToEntry(entry.id)" />
        </li>
      }
    </ul>
  }

  @if (facade.errorMessage()) {
    <p class="subject__form-error">{{ facade.errorMessage() }}</p>
  }
</app-ui-page>

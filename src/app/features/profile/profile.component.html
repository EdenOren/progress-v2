@let t = facade.translation();

<app-ui-page [title]="t['TITLE']" [narrow]="true">
  @if (facade.isReady()) {
    <button
      slot="primary"
      class="profile__save-btn"
      [type]="buttonType.Button"
      [disabled]="facade.isSaving()"
      (click)="onSave()">
      {{ t['SAVE'] }}
    </button>
  }

  <div class="profile__content">
    @if (facade.isLoading()) {
      <p class="profile__loading">{{ t['LOADING'] }}</p>
    } @else if (facade.hasError()) {
      <p class="profile__error">{{ t['LOAD_ERROR'] }}</p>
    } @else {
      <form [formRoot]="profileForm" class="profile__form">
        <app-ui-input
          inputId="display-name"
          [label]="t['DISPLAY_NAME']"
          [type]="inputType.Text"
          [field]="profileForm.displayName"
          [error]="displayNameError()"
          [touched]="displayNameTouched()"
        />

        <app-ui-input
          inputId="date-of-birth"
          [label]="t['DATE_OF_BIRTH']"
          [type]="inputType.Date"
          [field]="profileForm.dateOfBirth"
        />

        <app-ui-input
          inputId="height"
          [label]="t['HEIGHT']"
          [type]="inputType.Number"
          [value]="heightCm()"
          [min]="50"
          [max]="300"
          (valueChange)="onHeightChange($event)"
        />

        @if (facade.saveSuccess()) {
          <p class="profile__feedback profile__feedback--success" role="status">
            {{ t['SAVE_SUCCESS'] }}
          </p>
        }
        @if (facade.saveError()) {
          <p class="profile__feedback profile__feedback--error" role="status">
            {{ t['SAVE_ERROR'] }}
          </p>
        }
      </form>
    }
  </div>
</app-ui-page>

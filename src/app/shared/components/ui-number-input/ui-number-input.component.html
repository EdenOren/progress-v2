<input
  class="ui-number-input"
  [class.ui-number-input--compact]="compact()"
  type="number"
  [id]="inputId()"
  [attr.aria-label]="ariaLabel()"
  [value]="value()"
  [min]="min()"
  [max]="max() ?? ''"
  [step]="step()"
  [disabled]="disabled()"
  [placeholder]="placeholder()"
  (blur)="onBlur($event)" />

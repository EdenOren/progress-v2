<app-ui-modal>
  <span slot="title">{{ data.title }}</span>
  <p slot="content" class="confirmation-dialog__message">{{ data.message }}</p>
  <div slot="actions">
    <button
      mat-button
      type="button"
      (click)="cancel()">
      {{ data.cancelLabel }}
    </button>
    <button
      mat-button
      cdkFocusInitial
      type="button"
      color="warn"
      (click)="confirm()">
      {{ data.confirmLabel }}
    </button>
  </div>
</app-ui-modal>

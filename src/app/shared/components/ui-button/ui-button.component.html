@switch (variant()) {
  @case (buttonVariant.Ghost) {
    @if (iconOnly()) {
      <button
        mat-icon-button
        [color]="color()"
        [type]="type()"
        [disabled]="disabled() || isLoading()"
        [attr.aria-label]="label()">
        @if (icon()) {
          <mat-icon aria-hidden="true">{{ icon() }}</mat-icon>
        }
      </button>
    } @else {
      <button
        mat-button
        [color]="color()"
        [type]="type()"
        [disabled]="disabled() || isLoading()">
        @if (icon()) {
          <mat-icon aria-hidden="true">{{ icon() }}</mat-icon>
        }
        {{ label() }}
      </button>
    }
  }
  @default {
    <button
      class="ui-button"
      [class.ui-button--google]="variant() === buttonVariant.Google"
      [class.ui-button--sm]="size() === buttonSize.Sm"
      [type]="type()"
      [disabled]="disabled() || isLoading()">
      @if (isLoading()) {
        <span class="ui-button__spinner" aria-hidden="true"></span>
      } @else if (icon()) {
        <mat-icon aria-hidden="true">{{ icon() }}</mat-icon>
      }
      {{ label() }}
    </button>
  }
}
